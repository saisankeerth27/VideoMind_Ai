services:
  - type: web
    name: videomind-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_MODEL
        value: gemini-flash-latest
      - key: AI_FALLBACK_MODELS
        value: gemini-flash-lite-latest
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.13
